name: AURIX CI Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest mypy flake8

      - name: Run Flake8 Style Compliance
        run: |
          python -m flake8 aurix_core/ aurix_api/ tests/ --max-line-length=120

      - name: Run Mypy Strict Type Checking
        run: |
          python -m mypy aurix_core aurix_api tests --strict --explicit-package-bases

      - name: Run Pytest Regression Test Suite
        run: |
          python -m pytest tests/ -v