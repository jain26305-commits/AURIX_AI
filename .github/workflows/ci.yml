name: AURIX CI Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurix_ci
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aurix_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AURIX_ENVIRONMENT: test
      API_SECRET_KEY: ci-only-test-secret-key-32-characters-minimum-xxxxxxxx
      ENABLE_DOCS: "false"
      ARTIFACT_STORAGE_BACKEND: local

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit

      - name: Audit Python Dependencies
        run: |
          python -m pip_audit -r requirements.txt

      - name: Run Bandit Security Scan
        run: |
          python -m bandit -r aurix_core aurix_api -ll -ii

      - name: Run Flake8 Style Compliance
        run: |
          python -m flake8 aurix_core/ aurix_api/ tests/

      - name: Run Mypy Strict Type Checking
        run: |
          python -m mypy aurix_core aurix_api tests --strict --explicit-package-bases

      - name: Validate PostgreSQL Migrations
        env:
          PGPASSWORD: postgres
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Prepare Non-Privileged RLS Test Role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d aurix_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              CREATE ROLE aurix_rls_test
                LOGIN
                PASSWORD 'aurix_rls_test_password'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS;
            EXCEPTION
              WHEN duplicate_object THEN NULL;
            END
            \$\$;
          "

          psql -h localhost -U postgres -d aurix_ci -v ON_ERROR_STOP=1 -c "
            GRANT CONNECT
              ON DATABASE aurix_ci
              TO aurix_rls_test;

            GRANT USAGE
              ON SCHEMA public
              TO aurix_rls_test;

            GRANT SELECT, INSERT, UPDATE, DELETE
              ON ALL TABLES IN SCHEMA public
              TO aurix_rls_test;

            GRANT USAGE, SELECT, UPDATE
              ON ALL SEQUENCES IN SCHEMA public
              TO aurix_rls_test;
          "

      - name: Run PostgreSQL Tenant Isolation Tests
        env:
          AURIX_RLS_TEST_DATABASE_URL: >-
            postgresql+psycopg://aurix_rls_test:aurix_rls_test_password@localhost:5432/aurix_ci
        run: |
          python -m pytest -q tests/test_p0_tenant_rls.py

      - name: Run Full Regression Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Build Production Docker Image
        run: |
          docker build -t aurix:ci .

      - name: Smoke Test Docker Container
        run: |
          docker run -d --name aurix-ci-smoke \
            -p 18000:8000 \
            -e PORT=8000 \
            -e AURIX_ENVIRONMENT=test \
            -e DATABASE_URL="sqlite:////tmp/aurix_ci.db" \
            -e API_SECRET_KEY="ci-smoke-secret-key-32-characters-minimum-xxxxxxxx" \
            -e ENABLE_DOCS=false \
            -e ALLOW_SCHEMA_AUTOCREATE=true \
            aurix:ci

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs aurix-ci-smoke
          exit 1

      - name: Cleanup Docker Smoke Container
        if: always()
        run: |
          docker rm -f aurix-ci-smoke 2>/dev/null || true