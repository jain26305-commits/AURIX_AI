<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aurix-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F0D9" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#5B4307" />
    </linearGradient>
    <linearGradient id="aurix-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="aurix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Node -->
  <rect width="100" height="100" rx="22" fill="#07090D" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Outer Geometric Delta Apex -->
  <path d="M 50 14 L 84 76 L 70 76 L 50 38 L 30 76 L 16 76 Z" fill="url(#aurix-gold)" filter="url(#aurix-glow)" />
  
  <!-- Inner Deterministic Core Diamond -->
  <polygon points="50,44 62,66 50,74 38,66" fill="#0C0E12" stroke="url(#aurix-gold)" stroke-width="1.5" />
  
  <!-- Electric Blue Nexus Point -->
  <circle cx="50" cy="62" r="3.5" fill="url(#aurix-cyan)" filter="url(#aurix-glow)" />
</svg>